name: Release

# Each push to main can make a release. The version comes from the version: labels of the pull requests merged
# since the last tag: version:major, version:minor or version:patch bumps it, version:none does not.
# The release job creates the GitHub Release v<version> with its tag and its notes, and the publish job publishes
# the npm package with that version. package.json on main keeps a placeholder version.
# The publish job is in this workflow because a tag that GITHUB_TOKEN creates starts no other workflow.
# npm trusted publishing names this file and the npm-publish environment. Do not rename them.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release and its tag
      pull-requests: read # read the labels of the merged pull requests
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Find the next version from the version labels
        id: next
        # A cancelled waiting run is not lost: the next run counts its pull requests too.
        # A tag on the pushed commit comes from a re-run, or from a person. It must be the version that the labels
        # give. The release is done when npm has the version, so until then each run does the checks and publishes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$GITHUB_SHA^")"
          head_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -- - || true)"
          next="$(node scripts/version.mjs next "$GITHUB_REPOSITORY" "$last" "$GITHUB_SHA")"
          version="$(jq -r .version <<<"$next")"
          internal="$(jq -r .internal <<<"$next")"
          if [ "$version" = null ]; then
            if [ -n "$head_tag" ]; then
              echo "$head_tag tags $GITHUB_SHA, but each pull request after $last has version:none"
              exit 1
            fi
            echo "Each pull request after $last has version:none. No release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$head_tag" ] && [ "$head_tag" != "v$version" ]; then
            echo "$head_tag tags $GITHUB_SHA, but the labels of the pull requests after $last give v$version"
            exit 1
          fi
          # npm view exits 1 with E404 for a version that is not published. Any other error stops the run.
          err="$RUNNER_TEMP/npm-view-error.txt"
          if published="$(npm view "@grafana/viz-contract@$version" version 2>"$err")"; then :
          elif grep -q E404 "$err"; then published=""
          else cat "$err"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "internal=$internal" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ]; then
            echo "$version is already published. No release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$version after $last (internal: $internal)."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the contract checks
        if: steps.next.outputs.release == 'true'
        working-directory: scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node check.mjs
      - name: Create the GitHub Release and its tag
        if: steps.next.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          INTERNAL: ${{ steps.next.outputs.internal }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub Release v$VERSION already exists"
            exit 0
          fi
          notes=""
          if [ "$INTERNAL" = true ]; then
            notes="Internal: this release changes only interfaces with the internal or the provisional promise."
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes --notes "$notes"

  publish:
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing; it also adds provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish
        # Node 24 comes with npm 11.5.1 or later, which trusted publishing needs.
        # The version comes from the tag. package.json on main keeps a placeholder.
        # A re-run after npm accepted the upload goes green instead of failing.
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if npm view "@grafana/viz-contract@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already published"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --ignore-scripts
