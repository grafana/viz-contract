name: Release

# A push to main with a new version in package.json makes a release:
# the tag job checks the version against the version: labels and creates the tag v<version>,
# then the publish job publishes the npm package. A push that keeps the version does nothing.
# The publish job is in this workflow because a tag that GITHUB_TOKEN creates starts no other workflow.
# npm trusted publishing names this file and the npm-publish environment. Do not rename them.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag
      pull-requests: read # read the labels of the merged pull requests
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      tagged: ${{ steps.version.outputs.tagged || steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Read the version
        id: version
        # The release commit is the last commit that changed the version, not always the pushed commit.
        # Thus a run for a later push (when GitHub cancels a waiting run) tags the same commit with the same labels.
        run: |
          version="$(node -p "require('./package.json').version")"
          sha="$(git log -1 --first-parent --format=%H -G'"version":' "$GITHUB_SHA" -- package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          tagged="$(git rev-parse -q --verify "refs/tags/v$version^{commit}" || true)"
          if [ -z "$tagged" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif [ "$tagged" = "$sha" ] && [ "$sha" = "$GITHUB_SHA" ]; then
            # A re-run of all jobs for the release push, after the tag job created the tag.
            # Publish again. The publish step is idempotent.
            echo "v$version already tags $sha. Publish only."
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          elif [ "$sha" = "$GITHUB_SHA" ]; then
            # This push changed the version, but a tag made by hand already names another commit.
            echo "v$version tags $tagged, not the release commit $sha. Delete the tag or pick a new version."
            exit 1
          else
            echo "v$version is already tagged. No release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the version against the version labels
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA")"
          expected="$(node scripts/version.mjs expected "$GITHUB_REPOSITORY" "$last" "$SHA")"
          if [ "$expected" != "$VERSION" ]; then
            echo "package.json gives $VERSION, but the labels of the pull requests after $last give $expected"
            exit 1
          fi
      - name: Run the contract checks on the release commit
        if: steps.version.outputs.new == 'true'
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          git checkout -q "$SHA"
          cd scripts
          npm ci --ignore-scripts --no-audit --no-fund
          node check.mjs
      - name: Create the tag
        id: tag
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null
          echo "Tagged $SHA v$VERSION"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing; it also adds provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish
        # Node 24 comes with npm 11.5.1 or later, which trusted publishing needs.
        # A re-run after npm accepted the upload goes green instead of failing.
        # The npm provenance names GITHUB_SHA. If GitHub cancelled the waiting run of the release push, a later
        # push does the release, and the provenance names that later commit, not the tagged commit.
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if npm view "@grafana/viz-contract@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already published"
            exit 0
          fi
          npm publish --ignore-scripts
